
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>2027 デート</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 220px;
    margin: 0;
    padding: 10px 10px 20px;
    font-family: "Noto Serif JP", serif;
    color: #3e3e3e;
}

.container {
    width: 100%;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
}

.title {
    font-family: "Noto Serif JP", serif;
    color: #3e3e3e;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 18px;
    width: 100%;
}

.flip-card {
    background: #c0e3d9;
    border-radius: 12px;

    width: 78vw;
    max-width: 260px;
    height: 170px;

    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    margin: 0 auto;
}

.number {
    font-family: "Noto Serif JP", serif;
    color: #3e3e3e;
    font-size: clamp(48px, 15vw, 58px);
    font-weight: 600;
    line-height: 1.2;
    display: inline-block;
    font-variant-numeric: tabular-nums;
}

.flip {
    animation: flip 0.6s ease-in-out;
    transform-origin: center center;
}

@keyframes flip {
    0% {
        transform: rotateX(0deg);
        opacity: 1;
    }

    50% {
        transform: rotateX(-90deg);
        opacity: 0;
    }

    100% {
        transform: rotateX(0deg);
        opacity: 1;
    }
}

.label {
    font-family: "Noto Serif JP", serif;
    color: #3e3e3e;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 4px;
    margin-top: 10px;
}

.footer {
    font-family: "Noto Serif JP", serif;
    color: #3e3e3e;
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 15px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">2027 デート</div>

    <div class="flip-card">
        <div class="number" id="days">0</div>
        <div class="label">DAYS</div>
    </div>

    <div class="footer">
        2027.01.31 — 2027.02.06
    </div>

</div>

<script>
const target = new Date("2027-01-31T00:00:00+09:00");

let previousDays = null;

function updateCountdown() {

    const japanDate = new Date(
        new Date().toLocaleString("en-US", {
            timeZone: "Asia/Tokyo"
        })
    );

    const today = Date.UTC(
        japanDate.getFullYear(),
        japanDate.getMonth(),
        japanDate.getDate()
    );

    const targetDay = Date.UTC(
        target.getUTCFullYear(),
        target.getUTCMonth(),
        target.getUTCDate()
    );

    const diff = targetDay - today;

    const days = Math.max(
        0,
        Math.ceil(diff / 86400000)
    );

    const element = document.getElementById("days");

    if (days !== previousDays) {
        element.classList.remove("flip");

        void element.offsetWidth;

        element.textContent = days;

        element.classList.add("flip");

        previousDays = days;
    }
}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
