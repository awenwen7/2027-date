
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>2027 デート</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.title {
    font-family: "Yu Gothic", "游ゴシック", sans-serif;
    color: #3e3e3e;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 18px;
    width: 100%;
}

.flip-card {
    background: #c0e3d9;
    border-radius: 12px;
    width: 140px;
    height: 140px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.number {
    font-family: 'Noto Serif JP', serif;
    color: #3e3e3e;
    font-size: 48px;
    font-weight: 600;
    line-height: 1.2;
    display: inline-block;
}

.flip {
    animation: flip 0.6s ease-in-out;
    transform-origin: center center;
}

@keyframes flip {
    0% {
        transform: rotateX(0deg);
        opacity: 1;
    }

    50% {
        transform: rotateX(-90deg);
        opacity: 0;
    }

    100% {
        transform: rotateX(0deg);
        opacity: 1;
    }
}

.label {
    font-family: 'Noto Serif JP', serif;
    color: #3e3e3e;
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">2027 デート</div>

    <div class="flip-card">
        <div class="number" id="days">0</div>
        <div class="label">DAYS</div>
    </div>

</div>

<script>
// 目標日：2027年1月31日（日本時間）
const target = new Date("2027-01-31T00:00:00+09:00");

let previousDays = null;

function updateCountdown() {

    // 取得目前日本時間
    const japanDate = new Date(
        new Date().toLocaleString("en-US", {
            timeZone: "Asia/Tokyo"
        })
    );

    // 取得日本今天的日期
    const today = Date.UTC(
        japanDate.getFullYear(),
        japanDate.getMonth(),
        japanDate.getDate()
    );

    // 取得目標日期
    const targetDay = Date.UTC(
        target.getUTCFullYear(),
        target.getUTCMonth(),
        target.getUTCDate()
    );

    // 計算剩餘天數
    const diff = targetDay - today;

    const days = Math.max(
        0,
        Math.ceil(diff / 86400000)
    );

    const element = document.getElementById("days");

    // 數字改變時播放翻頁動畫
    if (days !== previousDays) {

        element.classList.remove("flip");

        void element.offsetWidth;

        element.textContent = days;

        element.classList.add("flip");

        previousDays = days;
    }
}

// 立即執行
updateCountdown();

// 每秒檢查一次
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
